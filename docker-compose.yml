services:
  orders:
    build: ./demo-shop/orders
    ports: ["8000:8000"]
    # ...whatever orders already has

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]

  prometheus:
    image: prom/prometheus
    volumes:
    - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./observability/alerts.yml:/etc/prometheus/alerts.yml
    ports: ["9090:9090"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports: ["16686:16686", "4317:4317"]

volumes:
  pgdata:
