global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orders
    static_configs:
      - targets: ["orders:8000"]
        labels: { service: orders }

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]